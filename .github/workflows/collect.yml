name: collect

on:
  schedule:
    # 00:05 US Pacific, written twice because GitHub schedules are UTC-only:
    # 07:05 UTC during daylight time, 08:05 UTC during standard time.
    # The run that lands at 23:05 or 01:05 Pacific finds nothing new and exits.
    - cron: "5 7 * * *"
    - cron: "5 8 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "실행할 명령"
        type: choice
        default: collect
        options: [collect, smoke, discover, draft, sheets]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMAND: ${{ inputs.command || 'collect' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Run
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          if [ -z "$YAHOO_REFRESH_TOKEN" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::notice::Yahoo secrets are not set yet - scheduled run skipped"
            exit 0
          fi
          python -m nbl "$COMMAND"
      - name: Save data
        # Runs even after a failure so days that did finish are kept.
        if: always()
        run: |
          git config user.name "nb-league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add data; fi
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $COMMAND $(date -u +%F)"
            git pull --rebase
            git push
          fi
